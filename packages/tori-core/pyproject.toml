[project]
name = "tori-core"
version = "0.1.0"
description = "Phần backend dùng chung: cấu hình, tạo app FastAPI, đăng nhập Google, SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
