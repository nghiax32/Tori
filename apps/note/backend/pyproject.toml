[project]
name = "note"
version = "0.1.0"
description = "Ghi chú nhanh, có thể đặt hạn chót hoặc không; đánh dấu xong khi đã làm"
requires-python = ">=3.12"
dependencies = ["tori-core", "sqlalchemy>=2.0.36"]

[tool.uv.sources]
tori-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/note"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
