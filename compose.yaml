# Chạy toàn bộ: cp .env.example .env && docker compose up -d --build
# Local: hub ở http://localhost, app ở http://calendar.localhost
name: tori

x-app: &app
  restart: unless-stopped
  env_file:
    - path: .env
      required: false

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TORI_DOMAIN: ${TORI_DOMAIN:-localhost}
      TORI_SCHEME: ${TORI_SCHEME:-http}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  hub:
    <<: *app
    image: ${IMAGE_PREFIX:-tori}-hub:${TAG:-latest}
    build: { context: ., dockerfile: apps/hub/Dockerfile }

  calendar:
    <<: *app
    image: ${IMAGE_PREFIX:-tori}-calendar:${TAG:-latest}
    build: { context: ., dockerfile: apps/calendar/Dockerfile }
    volumes:
      - calendar_data:/data

  news:
    <<: *app
    image: ${IMAGE_PREFIX:-tori}-news:${TAG:-latest}
    build: { context: ., dockerfile: apps/news/Dockerfile }
    volumes:
      - news_data:/data

  # @new-app-service  (scripts/new_app.py chèn app mới phía trên dòng này)

volumes:
  caddy_data:
  caddy_config:
  calendar_data:
  news_data:
  # @new-app-volume
